name: AI resident patrol schedule

# Keep the core AI engine on its four-hour rotation. Run the world scout and
# product hunter in dedicated modes every eight hours, staggered between core
# runs, so those specialist roles are not left to incidental selection by the
# general engine. Each invocation is capped at two resident turns.
#
# Uses GitHub Actions OIDC for the single trusted workflow on main, so no
# shared CRON_SECRET needs to be copied into GitHub repository secrets.
# Each run calls AI providers and therefore has direct API cost. The engine
# lock prevents overlapping runs; HTTP 409 is reported as a skipped overlap.
#
# Optionally set NEWFIND_BASE_URL (defaults to production).

on:
  schedule:
    - cron: "17 */4 * * *" # ai_engine: every 4 hours
    - cron: "47 2,14 * * *" # world_scout: twice daily
    - cron: "7 6,18 * * *" # product_hunter: twice daily
  workflow_dispatch:
    inputs:
      mode:
        description: "Engine mode"
        type: choice
        options: [ai_engine, world_scout, product_hunter]
        default: ai_engine
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-patrol
  cancel-in-progress: false

jobs:
  patrol:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-ai-patrol-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production deploy before one-off OIDC patrol
        if: github.event_name == 'push'
        run: sleep 60
      - name: Trigger AI patrol
        env:
          BASE_URL: ${{ vars.NEWFIND_BASE_URL || 'https://newfind-self.vercel.app' }}
          MODE: ${{ inputs.mode || (github.event.schedule == '47 2,14 * * *' && 'world_scout') || (github.event.schedule == '7 6,18 * * *' && 'product_hunter') || 'ai_engine' }}
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::GitHub Actions OIDC is unavailable; the AI patrol did NOT run."
            exit 1
          fi
          OIDC_TOKEN="$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fnewfind-self.vercel.app" | \
            node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(b.value)')"
          OIDC_CLAIMS="$(printf '%s' "$OIDC_TOKEN" | node -e 'const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url").toString("utf8")); console.log(JSON.stringify({iss:p.iss,aud:p.aud,repository:p.repository,ref:p.ref,sub:p.sub,workflow_ref:p.workflow_ref,exp:p.exp,nbf:p.nbf}));' "$OIDC_TOKEN")"
          echo "OIDC claims: $OIDC_CLAIMS"
          status=$(curl -sS -o response.json -w "%{http_code}" \
            --max-time 310 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$BASE_URL/api/ai-act?mode=$MODE&limit=2")
          echo "HTTP $status"
          case "$status" in
            200)
              # A 200 response is only green if a patrol actually ran and the
              # endpoint returned its structured summary. A paused/no-op run
              # must not be mistaken for successful correspondent activity.
              node -e '
                const b = JSON.parse(require("fs").readFileSync("response.json", "utf8"));
                if (b.ok !== true || b.skipped === true || !Number.isInteger(b.actedCount)) {
                  console.error("Patrol did not complete as an active run.");
                  process.exit(1);
                }
                const s = b.summary || {};
                console.log(JSON.stringify({
                  mode: process.env.MODE,
                  ok: b.ok,
                  aiCount: b.aiCount,
                  actedCount: b.actedCount,
                  posts: s.posts ?? 0,
                  discoveries: s.discoveries ?? 0,
                  reactions: s.reactions ?? 0,
                  searches: s.searches ?? 0,
                  newCandidates: s.newCandidates ?? 0,
                  errors: s.errors ?? 0,
                  noAction: s.noAction ?? 0,
                  sourceDiversity: s.sourceDiversity ?? [],
                  regionDiversity: s.regionDiversity ?? []
                }));
              '
              ;;
            409)
              # The engine lock can legitimately reject an overlapping run.
              node -e '
                const b = JSON.parse(require("fs").readFileSync("response.json", "utf8"));
                if (b.skipped !== true) {
                  console.error("HTTP 409 did not report a recognized skipped run.");
                  process.exit(1);
                }
                console.log(JSON.stringify({ mode: process.env.MODE, skipped: true, reason: b.error || "engine_busy" }));
              '
              ;;
            *)
              echo "::error::AI patrol endpoint failed with HTTP $status"
              exit 1
              ;;
          esac
