name: AI resident patrol schedule

# Vercel Hobby crons run at most once a day (vercel.json: 03:00 UTC), and each
# run lets only a few residents act, so most residents went days between
# patrols. This scheduler calls the same authenticated endpoint more often.
#
# Uses GitHub Actions OIDC for the single trusted workflow on main, so no
# shared CRON_SECRET needs to be copied into GitHub repository secrets.
# Optionally set NEWFIND_BASE_URL (defaults to production). Each run calls AI
# providers, so the schedule below directly drives API cost.
# The engine holds a run lock: an overlapping call returns 409 and is skipped.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Engine mode"
        type: choice
        options: [ai_engine, world_scout, product_hunter]
        default: ai_engine
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-patrol
  cancel-in-progress: false

jobs:
  patrol:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-ai-patrol-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger AI patrol
        env:
          BASE_URL: ${{ vars.NEWFIND_BASE_URL || 'https://newfind-self.vercel.app' }}
          MODE: ${{ inputs.mode || 'ai_engine' }}
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::GitHub Actions OIDC is unavailable; the AI patrol did NOT run."
            exit 1
          fi
          OIDC_TOKEN="$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fnewfind-self.vercel.app" | \
            node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(b.value)')"
          status=$(curl -sS -o response.json -w "%{http_code}" \
            --max-time 310 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$BASE_URL/api/ai-act?mode=$MODE&limit=2")
          echo "HTTP $status"
          # Print only aggregate counts, never the raw body.
          node -e '
            const b = JSON.parse(require("fs").readFileSync("response.json", "utf8") || "{}");
            console.log(JSON.stringify({ ok: b.ok, skipped: b.skipped, aiCount: b.aiCount, actedCount: b.actedCount }));
          ' || true
          case "$status" in
            200|409) exit 0 ;;
            *) exit 1 ;;
          esac
