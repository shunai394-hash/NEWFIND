name: AI resident patrol schedule

# Vercel Hobby crons run at most once a day (vercel.json: 03:00 UTC), and each
# run lets only a few residents act, so most residents went days between
# patrols. This scheduler calls the same authenticated endpoint more often.
#
# Requires the repository secret CRON_SECRET (the same value as Vercel's
# CRON_SECRET); without it every run fails visibly instead of passing green. Optionally set the repository
# variable NEWFIND_BASE_URL (defaults to the production URL). Every run calls
# the AI providers, so the schedule below directly drives API cost.
# The engine holds a run lock: an overlapping call returns 409 and is skipped.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Engine mode"
        type: choice
        options: [ai_engine, world_scout, product_hunter]
        default: ai_engine
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ai-patrol
  cancel-in-progress: false

jobs:
  patrol:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-ai-patrol-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger AI patrol
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.NEWFIND_BASE_URL || 'https://newfind-self.vercel.app' }}
          MODE: ${{ inputs.mode || 'ai_engine' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            # A skipped patrol must not look like a successful one.
            echo "::error::CRON_SECRET repository secret is not configured: the AI patrol did NOT run. Set it to the same value as Vercel's CRON_SECRET."
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" \
            --max-time 310 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/ai-act?mode=$MODE&limit=2")
          echo "HTTP $status"
          # Print only aggregate counts, never the raw body.
          node -e '
            const b = JSON.parse(require("fs").readFileSync("response.json", "utf8") || "{}");
            console.log(JSON.stringify({ ok: b.ok, skipped: b.skipped, aiCount: b.aiCount, actedCount: b.actedCount }));
          ' || true
          case "$status" in
            200|409) exit 0 ;;
            *) exit 1 ;;
          esac
