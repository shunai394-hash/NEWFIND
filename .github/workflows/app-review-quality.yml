name: App Review Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit (block production critical/high)
        # Keep the full dependency report informational, but fail the release
        # gate when production dependencies contain Critical/High advisories.
        run: |
          npm audit --json > "$RUNNER_TEMP/audit-all.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-production.json" || true
          node - "$RUNNER_TEMP/audit-all.json" "$RUNNER_TEMP/audit-production.json" <<'NODE'
          const fs = require("node:fs");
          for (const path of process.argv.slice(2)) {
            const production = path.includes("production");
            let report;
            try { report = JSON.parse(fs.readFileSync(path, "utf8")); }
            catch {
              console.log(JSON.stringify({ report: path, parseError: true }));
              if (production) process.exitCode = 1;
              continue;
            }
            const summary = report.metadata?.vulnerabilities ?? null;
            console.log(JSON.stringify({
              report: production ? "production-only" : "all-dependencies",
              summary,
              advisories: Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
                name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: (item.via ?? []).map((entry) => typeof entry === "string" ? entry : entry.title),
              })),
            }));
            if (production && (Number(summary?.critical ?? 0) > 0 || Number(summary?.high ?? 0) > 0)) {
              console.error("Production dependency audit contains Critical/High vulnerabilities.");
              process.exitCode = 1;
            }
          }
          NODE

      - name: App icons are committed, up to date and App Store-valid
        # Fails if the PNGs differ from public/brand/app-icon.svg, have an alpha
        # channel, wrong sizes, missing slots or stale files.
        run: npm run icons:check

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint authentication and app-review modules
        run: >
          npx eslint --max-warnings=0
          lib/capacitor/oauth-return.ts
          lib/capacitor/oauth-return-core.ts
          lib/capacitor/oauth-browser.ts
          lib/auth/login-errors.ts
          lib/apple/client.ts
          app/api/auth/apple/native/route.ts
          components/auth-form.tsx
          components/brand-mark.tsx
          lib/account
          lib/apple/revoke.ts
          lib/apple/token-store.ts
          lib/auth/cron-auth.ts
          lib/ai/ai-act-handler.ts
          app/api/ai-act/route.ts
          app/api/account/route.ts
          app/api/integrations/outbox/drain/route.ts
          "app/api/admin/users/[id]/route.ts"
          lib/apple/verify.ts

      - name: Authentication regression tests
        run: npm run test:auth

      - name: Account deletion and secret-handling tests
        run: npm run test:security

      - name: Integration contract tests
        run: npx tsx scripts/test-tracer-integration.ts

      - name: Production build
        run: npm run build

  ios-native-compile:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release config rejects localhost server URLs
        run: |
          if CAPACITOR_SERVER_URL=http://localhost:3000 CAPACITOR_RELEASE=1 npx cap sync ios > "$RUNNER_TEMP/invalid-release-config.log" 2>&1; then
            echo "Release configuration unexpectedly accepted localhost."
            exit 1
          fi
          if ! grep -Fq "requires CAPACITOR_SERVER_URL to be an explicit HTTPS URL" "$RUNNER_TEMP/invalid-release-config.log"; then
            cat "$RUNNER_TEMP/invalid-release-config.log"
            echo "Release configuration failed for an unexpected reason."
            exit 1
          fi

      - name: Sync Capacitor iOS project
        env:
          CAPACITOR_SERVER_URL: https://newfind-self.vercel.app
          CAPACITOR_RELEASE: "1"
        run: npx cap sync ios

      - name: Compile native iOS app without signing
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
