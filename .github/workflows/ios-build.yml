name: NEWFIND iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: |
          export CAPACITOR_SERVER_URL="https://newfind-self.vercel.app"
          export CAPACITOR_RELEASE="1"
          npx cap sync ios

      - name: Install signing files
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/signing.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"

          echo "$P12_BASE64" | base64 --decode > "$CERT"
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"

          security import "$CERT" \
            -P "$P12_PASSWORD" \
            -A \
            -k "$KEYCHAIN"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          security list-keychain -d user -s "$KEYCHAIN"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/NEWFIND.mobileprovision"

      - name: Archive
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/NEWFIND.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=R35GA3276S \
            PROVISIONING_PROFILE_SPECIFIER="NEWFIND App Store" \
            archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>R35GA3276S</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.newfind.social</key>
              <string>NEWFIND App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/NEWFIND.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NEWFIND-IPA
          path: build/ios/ipa/*.ipa
