name: NEWFIND Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Content moderation
        run: npm run test:content-moderation
      - name: Discovery quality
        run: npm run test:discovery-quality
      - name: AI precision
        run: npm run test:ai-precision
      - name: AI correspondent
        run: npm run test:ai-correspondent
      - name: Production build
        run: npm run build
