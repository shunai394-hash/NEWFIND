name: one-time-tracer-origin-fix

on:
  push:
    paths:
      - "ops/trigger-tracer-origin-fix.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TRACER origin validation
        shell: python
        run: |
          from pathlib import Path
          p = Path("lib/integration/tracer-attestation.ts")
          s = p.read_text(encoding="utf-8-sig")
          old = '''  const salesUrl = text(payload.sales_url) ?? text(payload.tracer_url);\n  if (!salesUrl) return { ok: false, reason: "tracer_sales_url_missing" };\n  const productUrl = text(payload.product_url);\n  // The promoted link must be TRACER's own sales page: price and image in\n  // the payload belong to that page, not to a marketplace listing.\n  if (productUrl && productUrl !== salesUrl) return { ok: false, reason: "tracer_product_url_not_sales_url" };\n'''
          new = '''  const salesUrl = text(payload.sales_url) ?? text(payload.tracer_url);\n  if (!salesUrl) return { ok: false, reason: "tracer_sales_url_missing" };\n  let parsedSalesUrl: URL;\n  try {\n    parsedSalesUrl = new URL(salesUrl);\n  } catch {\n    return { ok: false, reason: "tracer_sales_url_invalid" };\n  }\n  if (parsedSalesUrl.protocol !== "https:" || parsedSalesUrl.hostname !== "tracer-self.vercel.app") {\n    return { ok: false, reason: "tracer_sales_url_untrusted_origin" };\n  }\n  const canonicalSalesUrl = parsedSalesUrl.toString();\n  const productUrl = text(payload.product_url);\n  // The promoted link must be TRACER's own sales page: price and image in\n  // the payload belong to that page, not to a marketplace listing.\n  if (productUrl) {\n    try {\n      const parsedProductUrl = new URL(productUrl);\n      if (parsedProductUrl.toString() !== canonicalSalesUrl) {\n        return { ok: false, reason: "tracer_product_url_not_sales_url" };\n      }\n    } catch {\n      return { ok: false, reason: "tracer_product_url_invalid" };\n    }\n  }\n'''
          if old not in s:
              raise SystemExit("expected attestation block not found; refusing unsafe patch")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
      - name: Verify and clean up
        shell: bash
        run: |
          grep -n -A28 'const salesUrl' lib/integration/tracer-attestation.ts
          rm -f ops/trigger-tracer-origin-fix.txt .github/workflows/one-time-tracer-origin-fix.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/integration/tracer-attestation.ts ops/trigger-tracer-origin-fix.txt .github/workflows/one-time-tracer-origin-fix.yml
          git diff --cached --check
          git commit -m "security(tracer): enforce official HTTPS publication origin"
          git push origin HEAD:main
