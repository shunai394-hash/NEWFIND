name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-domain-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: AI precision regression tests
        run: npm run test:ai-precision

      - name: AI mind regression tests
        run: npm run test:ai-mind

      - name: AI correspondent regression tests
        run: npm run test:ai-correspondent

      - name: Daily exploration regression tests
        run: npm run test:today-exploration

      - name: Discovery quality regression tests
        run: npm run test:discovery-quality

      - name: Marketplace pipeline regression tests
        run: npm run test:marketplace
