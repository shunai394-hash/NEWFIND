name: Read-only production probe

# Read-only evidence for the AI patrol: public GET endpoints only, no secrets,
# no writes. Runs on pushes to the probe branch only.
on:
  push:
    branches: ["claude/sweet-cori-vf28y4"]
    paths: [".github/workflows/readonly-production-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public endpoints
        shell: bash
        run: |
          set -uo pipefail
          N=https://newfind-self.vercel.app
          mkdir -p probe
          for p in api/health api/world/today api/discovery api/integrations/tracer; do
            f="probe/$(echo "$p" | tr '/' '_').json"
            code=$(curl -sS -o "$f" -w '%{http_code}' --max-time 60 "$N/$p" || echo 000)
            echo "$p HTTP $code $(wc -c < "$f") bytes"
          done
          code=$(curl -sS -o probe/home.html -w '%{http_code}' --max-time 60 "$N/" || echo 000)
          echo "/ HTTP $code $(wc -c < probe/home.html) bytes"
      - name: Analyse
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, unicodedata, collections
          def load(n):
              try: return json.load(open(f"probe/{n}"))
              except Exception as e: return {"_error": str(e)}
          print("health:", load("api_health.json"))
          w = load("api_world_today.json")
          print("world/today:", {k: w.get(k) for k in ("reportAvailable","residents","posts","products","news","investigations")})
          for h in (w.get("headlines") or [])[:8]:
              print("  headline:", h.get("actor"), "|", h.get("kind"), "|", (h.get("title") or "")[:80])
          # Same rule as lib/ai/craft-object.ts
          EN_P = r"(?:hand[\s-]?made|hand[\s-]?crafted|hand[\s-]?blown|craft(?:ed)?|artisan(?:al)?|decorative|ceramic|pottery|glass\s+art)"
          EN_O = r"(?:glass\s+)?(?:bottles?|vessels?|jars?|containers?|vases?|decor|ornaments?|objects?|objets?|crafts?)"
          PAT = [re.compile(rf"\b{EN_P}\s+{EN_O}\b", re.I), re.compile(r"\bart\s+(?:bottle|vessel|object)s?\b", re.I),
                 re.compile(r"\bpottery\b", re.I), re.compile(r"\bfigurines?\b", re.I), re.compile(r"\bornaments?\b", re.I),
                 re.compile(r"\bresin\s+art\b", re.I), re.compile(r"\bwood\s+carvings?\b", re.I), re.compile(r"\bbud\s+vases?\b", re.I),
                 re.compile(r"(?:クラフト|ハンドメイド|手作り|手づくり|手仕事|手吹き|工芸|作家|アート|装飾)(?:の|な)?\s*(?:ガラス(?:の)?)?\s*(?:ボトル|瓶(?!詰)|びん(?!詰)|ビン(?!詰)|ベッセル|器(?![具械材])|うつわ|花瓶|花器|一輪挿し|オブジェ(?!クト)|置物)"),
                 re.compile(r"陶芸|置物|オブジェ(?!クト)|一輪挿し")]
          craft = lambda t: any(p.search(unicodedata.normalize("NFKC", t or "")) for p in PAT)
          d = load("api_discovery.json")
          prods = d.get("products") or []
          print("\ndiscovery (public approved):", len(prods))
          get = lambda p, *ks: next((p.get(k) for k in ks if p.get(k) not in (None, "")), None)
          src = collections.Counter(get(p, "discoverySource", "discovery_source") or "unknown" for p in prods)
          print("  by source:", dict(src))
          names = [str(get(p, "productName", "product_name") or "") for p in prods]
          norm = lambda s: re.sub(r"[\s\W_]+", "", unicodedata.normalize("NFKC", s).lower())
          dup_name = {k: v for k, v in collections.Counter(norm(n) for n in names).items() if v > 1 and k}
          urls = [str(get(p, "productUrl", "product_url") or "") for p in prods]
          dup_url = {k: v for k, v in collections.Counter(urls).items() if v > 1 and k}
          imgs = [str(get(p, "productImageUrl", "product_image_url") or "") for p in prods]
          dup_img = {k: v for k, v in collections.Counter(imgs).items() if v > 1 and k}
          no_img = sum(1 for i in imgs if not re.match(r"^https?://", i))
          jp = re.compile(r"[぀-ヿ一-鿿]")
          non_jp = sum(1 for n in names if not jp.search(n))
          crafts = [(get(p, "productName", "product_name"), get(p, "discoverySource", "discovery_source"), get(p, "createdAt", "created_at")) for p in prods if craft(f'{get(p, "productName", "product_name")} {get(p, "description") or ""}')]
          print("  duplicate names:", len(dup_name), list(dup_name.items())[:8])
          print("  duplicate urls:", len(dup_url))
          print("  duplicate images:", len(dup_img), list(dup_img.items())[:3])
          print("  missing/invalid image:", no_img)
          print("  names without Japanese:", non_jp, "/", len(names))
          print("  craft-object matches:", len(crafts))
          for c in crafts[:15]: print("   craft:", c)
          bottle = [n for n in names if re.search(r"瓶|ボトル|bottle", n, re.I)]
          print("  names containing 瓶/ボトル/bottle:", len(bottle), bottle[:10])
          home = open("probe/home.html", encoding="utf-8", errors="ignore").read()
          print("\nhomepage: クラフト瓶", home.count("クラフト瓶"), "| クラフトボトル", home.count("クラフトボトル"), "| craft bottle", len(re.findall(r"craft bottle", home, re.I)))
          print("tracer receiver:", load("api_integrations_tracer.json"))
          PY
