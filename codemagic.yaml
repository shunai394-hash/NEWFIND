workflows:
  ios-release:
    name: NEWFIND iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: NEWFIND-Codemagic

    environment:
      node: 24.14.0
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - NEWFIND-App-Store３
        certificates:
          - NEWFIND-Distribution-2026

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Set production Capacitor URL
        script: |
          export CAPACITOR_SERVER_URL="https://newfind-self.vercel.app"
          export CAPACITOR_RELEASE="1"
          npx cap sync ios

      - name: Apply iOS signing
        script: xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration


