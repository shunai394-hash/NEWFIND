workflows:
  ios-release:
    name: NEWFIND iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: NEWFIND-Codemagic

    environment:
      node: 24.14.0
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - NEWFIND-App-Store-FINAL-2026
        certificates:
          - NEWFIND-Distribution-2026
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Verify final app icons
        # Icons are committed; fail the build if they are stale, transparent or missing.
        script: npm run icons:check

      - name: Check iOS signing files
        script: |
          echo "=== PROVISIONING PROFILES ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          echo "=== CERTIFICATES ==="
          ls -la "$HOME/Library/MobileDevice/Certificates/" || true
          echo "=== KEYCHAIN ==="
          security find-identity -v -p codesigning || true

      - name: Set production Capacitor URL
        script: |
          export CAPACITOR_SERVER_URL="https://newfind-self.vercel.app"
          export CAPACITOR_RELEASE="1"
          npx cap sync ios

      - name: Build IPA
        script: |
          set -e

          echo "=== SET BUILD NUMBER ==="
          # App Store Connect rejects a build number that was already uploaded.
          # Use the next number after the latest uploaded build when the App
          # Store Connect app id is configured, never lower than the project's.
          PROJECT_BUILD=$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([0-9]*\);.*/\1/p' ios/App/App.xcodeproj/project.pbxproj | head -1)
          NEXT_BUILD="$PROJECT_BUILD"
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST_BUILD=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --platform IOS 2>/dev/null | tail -1 | tr -dc '0-9')
            if [ -n "$LATEST_BUILD" ] && [ "$((LATEST_BUILD + 1))" -gt "$NEXT_BUILD" ]; then
              NEXT_BUILD=$((LATEST_BUILD + 1))
            fi
          else
            echo "APP_STORE_APPLE_ID is not set; using project build number $PROJECT_BUILD"
          fi
          echo "Build number: $NEXT_BUILD"
          cd ios/App
          agvtool new-version -all "$NEXT_BUILD"
          cd ../..

          echo "=== ARCHIVE ==="

          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            DEVELOPMENT_TEAM="R35GA3276S" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="NEWFIND-App-Store-FINAL-2026" \
            archive

          echo "=== CREATE EXPORT OPTIONS ==="

          cat > "$CM_BUILD_DIR/export_options.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>R35GA3276S</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>app.newfind.social</key>
                  <string>NEWFIND-App-Store-FINAL-2026</string>
              </dict>
          </dict>
          </plist>
          PLIST

          echo "=== EXPORT IPA ==="

          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/export_options.plist"

          echo "=== IPA RESULT ==="
          ls -lah "$CM_BUILD_DIR/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration

